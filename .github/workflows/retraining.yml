name: Fraud Shield AI - Automatic Retraining

on:
  # Automatic daily drift check
  schedule:
    - cron: "0 18 * * *"

  # Manual testing
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: "Simulate data drift for testing"
        required: true
        default: false
        type: boolean


jobs:

  # ==================================================
  # DRIFT DETECTION JOB
  # ==================================================

  drift-check:

    runs-on: ubuntu-latest

    outputs:
      drift_detected: ${{ steps.drift_check.outputs.drift_detected }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      - name: Configure DVC authentication
        run: |
          dvc remote modify --local dagshub_remote auth basic
          dvc remote modify --local dagshub_remote user gargi782005
          dvc remote modify --local dagshub_remote password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull reference dataset
        run: |
          dvc pull data/raw/creditcard.csv.dvc

      - name: Verify reference dataset
        run: |
          ls -lh data/raw/creditcard.csv

      # ==================================================
      # CREATE CURRENT MONITORING DATA
      # ==================================================

      - name: Create monitoring batch
        run: |
          python -c "
          import pandas as pd
          from pathlib import Path

          raw_file = Path('data/raw/creditcard.csv')
          log_file = Path('monitoring/prediction_logs.csv')

          feature_columns = (
              ['Time']
              + [f'V{i}' for i in range(1, 29)]
              + ['Amount']
          )

          df = pd.read_csv(raw_file)

          sample = df.sample(
              n=500,
              random_state=42
          )

          sample[feature_columns].to_csv(
              log_file,
              index=False
          )

          print('==========================================')
          print('       MONITORING BATCH CREATED')
          print('==========================================')
          print(f'Records: {len(sample)}')
          print('==========================================')
          "

      - name: Verify monitoring batch
        run: |
          ls -lh monitoring/prediction_logs.csv

          python -c "
          import pandas as pd

          df = pd.read_csv('monitoring/prediction_logs.csv')

          print('Monitoring records:', len(df))
          print(df[['Time', 'Amount']].head())
          "

      # ==================================================
      # OPTIONAL DRIFT SIMULATION
      # ==================================================

      - name: Simulate data drift
        if: inputs.simulate_drift == true
        run: |
          python -c "
          import pandas as pd

          file = 'monitoring/prediction_logs.csv'

          df = pd.read_csv(file)

          # Artificially change Amount distribution
          # This is ONLY for testing the retraining pipeline.
          df['Amount'] = df['Amount'] * 10

          df.to_csv(file, index=False)

          print('==========================================')
          print('      DATA DRIFT SIMULATION ENABLED')
          print('==========================================')
          print('Amount distribution was intentionally changed.')
          print('This is only a pipeline test.')
          print('==========================================')
          "

      # ==================================================
      # DRIFT DETECTION
      # ==================================================

      - name: Check data drift
        id: drift_check
        run: |
          set +e

          python monitoring/drift_detection.py

          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then

            echo "drift_detected=false" >> "$GITHUB_OUTPUT"

            echo "=========================================="
            echo "       NO SIGNIFICANT DATA DRIFT"
            echo "=========================================="

            exit 0

          elif [ $EXIT_CODE -eq 1 ]; then

            echo "drift_detected=true" >> "$GITHUB_OUTPUT"

            echo "=========================================="
            echo "          DATA DRIFT DETECTED"
            echo "=========================================="

            exit 0

          else

            echo "=========================================="
            echo "       DRIFT DETECTION FAILED"
            echo "=========================================="

            echo "Exit code: $EXIT_CODE"

            exit $EXIT_CODE

          fi

      - name: Show drift decision
        run: |
          echo "=========================================="
          echo "       FRAUD SHIELD AI - DRIFT CHECK"
          echo "=========================================="
          echo "Drift detected: ${{ steps.drift_check.outputs.drift_detected }}"
          echo "=========================================="


  # ==================================================
  # AUTOMATIC RETRAINING JOB
  # ==================================================

  retrain:

    needs: drift-check

    if: needs.drift-check.outputs.drift_detected == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      - name: Configure DVC authentication
        run: |
          dvc remote modify --local dagshub_remote auth basic
          dvc remote modify --local dagshub_remote user gargi782005
          dvc remote modify --local dagshub_remote password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull dataset from DagsHub
        run: |
          dvc pull data/raw/creditcard.csv.dvc

      - name: Verify dataset
        run: |
          ls -lh data/raw/creditcard.csv

      # ==================================================
      # FORCE RETRAINING
      # ==================================================

      - name: Run DVC retraining pipeline
        run: |
          echo "=========================================="
          echo "       STARTING MODEL RETRAINING"
          echo "=========================================="

          dvc repro -f

      # ==================================================
      # MODEL METRICS
      # ==================================================

      - name: Show model metrics
        run: |
          echo "=========================================="
          echo "          MODEL METRICS"
          echo "=========================================="

          dvc metrics show
      
      - name: Push retrained model to DVC remote
        run: |
          echo "=========================================="
          echo "       PUSHING UPDATED MODEL"
          echo "=========================================="

          dvc push

          echo "Updated model artifacts pushed to DVC remote."

      # ==================================================
      # FINAL RESULT
      # ==================================================

      - name: Show retraining result
        run: |
          echo "=========================================="
          echo "     FRAUD SHIELD AI - RETRAINING"
          echo "=========================================="
          echo "Data drift was detected."
          echo "Automatic retraining was triggered."
          echo "DVC pipeline was executed."
          echo "Fraud detection model was retrained."
          echo "Model evaluation was completed."
          echo "=========================================="